plugins { id 'com.android.application' }

def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'kr.manna.jangbu'
    compileSdk 34

    defaultConfig {
        applicationId 'kr.manna.jangbu'
        minSdk 26
        targetSdk 34
        versionCode runNo
        versionName "1.0.${runNo}"
    }

    signingConfigs {
        manna {
            // 깃허브 저장소 비밀값(KEYSTORE_B64, KEYSTORE_PASS)이 있으면 그 키로, 없으면 시험용 키로 서명
            def rel = rootProject.file('release.keystore')
            if (rel.exists() && System.getenv('KEYSTORE_PASS')) {
                storeFile rel
                storePassword System.getenv('KEYSTORE_PASS')
                keyAlias 'manna'
                keyPassword System.getenv('KEYSTORE_PASS')
            } else {
                storeFile rootProject.file('test.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.manna }
        debug { signingConfig signingConfigs.manna }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
