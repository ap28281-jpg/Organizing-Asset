<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5D4A">
<title>만나장부</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#F5F2EC; --card:#FFFFFF; --ink:#1E2420; --sub:#6B716C; --line:#E7E2D9;
    --accent:#2F5D4A; --accent-soft:#E3EDE7; --warn:#B4532F; --warn-soft:#F8E7DF;
    --plus:#2E7A57; --minus:#1E2420; --kb:#F4B400; --toss:#3182F6; --bar:#E9E4DA;
    --radius:20px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#121513; --card:#1B201D; --ink:#EEF1EE; --sub:#9AA19C; --line:#2A302C;
      --accent:#7FC2A0; --accent-soft:#213229; --warn:#F0916C; --warn-soft:#3A241B;
      --plus:#7FD1A6; --minus:#EEF1EE; --bar:#2A302C; }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--bg); color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
    font-feature-settings:"tnum"; letter-spacing:-0.01em}
  .wrap{max-width:480px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 14px) 16px 100px}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
  h1{font-size:20px; font-weight:800; margin:0; letter-spacing:-0.03em}
  h1 small{font-size:12px; font-weight:500; color:var(--sub); margin-left:6px}
  .icon-btn{border:0; background:transparent; color:var(--ink); width:40px; height:40px;
    border-radius:12px; display:grid; place-items:center; cursor:pointer}
  .icon-btn:active{background:var(--line)}
  .icon-btn svg{width:22px; height:22px}
  .spin svg{animation:spin 1s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}

  .cycle{display:flex; align-items:center; justify-content:space-between; margin:4px 0 14px}
  .cycle .mid{text-align:center}
  .cycle .mid b{display:block; font-size:16px}
  .cycle .mid span{font-size:12.5px; color:var(--sub)}

  .card{background:var(--card); border-radius:var(--radius); padding:18px; margin-bottom:12px;
    box-shadow:0 1px 0 rgba(0,0,0,.03)}
  .label{font-size:13px; color:var(--sub); font-weight:600; display:flex; justify-content:space-between}
  .big{font-size:32px; font-weight:800; letter-spacing:-0.03em; margin:6px 0 2px}
  .big.over{color:var(--warn)}
  .big small{font-size:16px; font-weight:700; margin-left:2px}
  .of{font-size:13px; color:var(--sub)}
  .bar{height:10px; background:var(--bar); border-radius:99px; overflow:hidden; margin:14px 0 12px}
  .bar i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .5s}
  .bar.over i{background:var(--warn)}
  .row{display:flex; justify-content:space-between; font-size:14px; padding:5px 0}
  .row span:first-child{color:var(--sub)}
  .row b{font-weight:700}
  .divider{height:1px; background:var(--line); margin:10px 0}
  .plus{color:var(--plus)}
  .pill{display:inline-block; font-size:11.5px; font-weight:700; padding:3px 8px; border-radius:99px;
    background:var(--accent-soft); color:var(--accent)}

  .notice{background:var(--warn-soft); color:var(--warn); border-radius:16px; padding:12px 14px;
    font-size:13.5px; line-height:1.5; margin-bottom:12px}

  .tabs{display:flex; gap:6px; margin:18px 0 10px; overflow-x:auto}
  .tab{border:0; background:var(--card); color:var(--sub); font:inherit; font-size:13.5px; font-weight:700;
    padding:8px 14px; border-radius:99px; white-space:nowrap; cursor:pointer}
  .tab.on{background:var(--ink); color:var(--bg)}

  .day{font-size:12.5px; color:var(--sub); font-weight:700; margin:16px 4px 6px}
  .tx{display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--card);
    border-radius:16px; margin-bottom:6px; cursor:pointer}
  .tx:active{transform:scale(.99)}
  .src{width:34px; height:34px; border-radius:11px; display:grid; place-items:center; flex:none;
    font-size:11px; font-weight:800; color:#fff}
  .src.KB{background:var(--kb); color:#3b2a00} .src.TOSS{background:var(--toss)} .src.수동{background:var(--sub)}
  .tx .mid{flex:1; min-width:0}
  .tx .t{font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .tx .s{font-size:12px; color:var(--sub); margin-top:2px}
  .tx .amt{font-size:15px; font-weight:700; text-align:right; white-space:nowrap}
  .tx .amt small{display:block; font-size:11px; color:var(--sub); font-weight:500}
  .tx.dim{opacity:.5}
  .chip{font-size:11px; font-weight:700; padding:1px 6px; border-radius:6px; margin-left:4px;
    background:var(--bar); color:var(--sub)}
  .chip.생활{background:var(--accent-soft); color:var(--accent)}
  .chip.gap{background:var(--warn-soft); color:var(--warn)}

  .section-title{font-size:15px; font-weight:800; margin:22px 4px 8px}
  .empty{text-align:center; color:var(--sub); font-size:14px; padding:30px 10px}

  .sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; z-index:10}
  .sheet{position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; background:var(--card);
    border-radius:24px 24px 0 0; padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);
    transform:translateY(105%); transition:transform .25s ease, visibility .25s; z-index:11; visibility:hidden}
  .sheet.open{transform:none; visibility:visible} .sheet-bg.open{display:block}
  .sheet h3{margin:0 0 4px; font-size:18px}
  .sheet p{margin:0 0 14px; color:var(--sub); font-size:13.5px; line-height:1.5}
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .opt{border:1.5px solid var(--line); background:transparent; color:var(--ink); font:inherit; font-weight:700;
    padding:12px 6px; border-radius:14px; cursor:pointer; font-size:14px}
  .opt small{display:block; font-weight:500; font-size:11px; color:var(--sub); margin-top:2px}
  .opt.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}
  input{width:100%; font:inherit; font-size:14px; padding:12px; border-radius:12px; border:1.5px solid var(--line);
    background:var(--bg); color:var(--ink); margin:4px 0 12px}
  .btn{width:100%; border:0; background:var(--accent); color:#fff; font:inherit; font-weight:800; font-size:15px;
    padding:14px; border-radius:14px; cursor:pointer}
  .toast{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px); transform:translateX(-50%);
    background:var(--ink); color:var(--bg); font-size:13.5px; padding:10px 16px; border-radius:99px;
    opacity:0; transition:opacity .2s; pointer-events:none; z-index:20}
  .toast.show{opacity:1}
  .muted{color:var(--sub); font-size:12px; text-align:center; margin-top:18px}
  .card.setup{border:2px solid var(--accent)} .card.setup .hint{font-size:12.5px; margin:12px 0 0; padding:10px; background:var(--bg); border-radius:10px} .card.setup p{font-size:14px; line-height:1.6; color:var(--sub); margin:6px 0 12px}
  .menu{display:flex; flex-direction:column; gap:8px; margin-bottom:10px}
  .menu button{text-align:left; border:1.5px solid var(--line); background:transparent; color:var(--ink); font:inherit; font-size:15px; font-weight:700; padding:12px 14px; border-radius:14px; cursor:pointer}
  .menu button small{display:block; font-size:12px; font-weight:500; color:var(--sub); margin-top:2px}
  .rlist{display:flex; flex-direction:column; gap:6px}
  .ritem{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px; border:1.5px solid var(--line); border-radius:12px; cursor:pointer}
  .ritem b{font-size:14.5px} .ritem small{display:block; font-size:12px; color:var(--sub); margin-top:2px; word-break:break-all}
  .ritem.off{opacity:.5}
  .src.c-kb{background:var(--kb); color:#3b2a00} .src.c-toss{background:var(--toss)} .src.c-kakao{background:#FEE500; color:#3a1d1d}
  .src.c-kbank{background:#1e2a6b} .src.c-naver{background:#03C75A} .src.c-etc{background:#6B7F74}
  .fixbar{display:block; width:100%; text-align:left; border:0; font:inherit; cursor:pointer}
  .sheet{max-height:88vh; overflow-y:auto}
  .rawbox{white-space:pre-wrap; background:var(--bg); border-radius:12px; padding:10px 12px; font-size:13px; line-height:1.5; margin-bottom:12px; max-height:140px; overflow:auto}
  .seg{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:4px 0 12px}
  .seg button,.amts button{border:1.5px solid var(--line); background:transparent; color:var(--ink); font:inherit; font-size:13.5px; font-weight:700; padding:10px 6px; border-radius:12px; cursor:pointer}
  .seg button.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}
  .amts{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 6px} .amts button{padding:6px 10px}
  .learn{display:flex; gap:8px; align-items:center; font-size:14px; font-weight:600; margin:4px 0 10px}
  .learn input{width:auto; margin:0}
  .btn.ghost{background:transparent; color:var(--sub); margin-top:8px}
  details.edit{margin-top:14px} details.edit summary{font-size:13.5px; color:var(--sub); cursor:pointer; margin-bottom:8px}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>만나장부<small>그날 쓸 만큼</small></h1>
    <div style="display:flex">
      <button class="icon-btn" id="refreshBtn" aria-label="새로고침"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
      <button class="icon-btn" id="settingsBtn" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>
  <main id="app"><div class="empty">불러오는 중…</div></main>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="core.js"></script>
<script src="local.js"></script>
<script>
const NATIVE = !!(window.Android && window.Android.drain);
const $ = (s) => document.querySelector(s);
const won = (n) => (n < 0 ? '-' : '') + Math.abs(Math.round(n)).toLocaleString('ko-KR');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CLASS_INFO = {
  '생활': '생활비에 포함', '고정': '구독·통신비·헌금 등', '할부': '할부 원금',
  '이동': '내 계좌끼리', '수입': '월급·사례비 등', '제외': '집계에서 빼기'
};
const SRC = { KB: ['KB', 'kb'], TOSS: ['토스', 'toss'], '카카오뱅크': ['카뱅', 'kakao'], '카카오페이': ['페이', 'kakao'],
  '카카오페이(알림톡)': ['페이', 'kakao'], '케이뱅크': ['K', 'kbank'], '네이버페이': ['N', 'naver'], '수동': ['기준', 'etc'] };
const srcBadge = (s) => SRC[s] || [String(s || '?').replace(/카드|뱅크|은행|\(.*\)/g, '').slice(0, 2) || '?', 'etc'];

// QR로 열었을 때: 주소 뒤 #url=…&token=… 를 읽어 자동 연결
(function autoConnect() {
  if (!location.hash) return;
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('url') && h.get('token')) {
    localStorage.setItem('manna.url', h.get('url'));
    localStorage.setItem('manna.token', h.get('token'));
    history.replaceState(null, '', location.pathname);
  }
})();

const state = {
  url: localStorage.getItem('manna.url') || '',
  token: localStorage.getItem('manna.token') || '',
  cycle: null, data: null, filter: '전체', loading: false
};

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}

async function api(body) {
  if (NATIVE) return Local.api(body);
  const res = await fetch(state.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ token: state.token }, body)) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || '저장 실패');
  return j;
}

async function load(cycle) {
  if (NATIVE) {
    try {
      Local.drainNative();
      state.data = Local.summary(cycle || null);
      state.cycle = state.data.isCurrent ? null : state.data.focusKey;
      render();
      if (!state.data.settings.설정완료 && !state.wizardShown) { state.wizardShown = true; openWizard(true); }
    } catch (e) { $('#app').innerHTML = `<div class="notice">문제가 생겼어: ${esc(e.message)}</div>`; }
    if (!state.fxTried) { state.fxTried = true; Local.refreshFx().then(() => { if (!state.loading) { state.data = Local.summary(state.cycle); render(); } }); }
    return;
  }
  if (!state.url || !state.token) { renderConnect(); return; }
  state.loading = true; $('#refreshBtn').classList.add('spin');
  const cacheKey = 'manna.cache.' + (cycle || 'now');
  const early = localStorage.getItem(cacheKey);
  if (early && !state.data) { try { state.data = JSON.parse(early); render(); } catch (e) {} }
  try {
    const u = new URL(state.url);
    u.searchParams.set('token', state.token);
    if (cycle) u.searchParams.set('cycle', cycle);
    const res = await fetch(u.toString());
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || '불러오기 실패');
    state.data = j.data; state.cycle = j.data.isCurrent ? null : j.data.focusKey;
    localStorage.setItem(cacheKey, JSON.stringify(j.data));
    render();
    if (!j.data.settings.설정완료 && !state.wizardShown) { state.wizardShown = true; openWizard(true); }
  } catch (e) {
    const cached = localStorage.getItem(cacheKey);
    if (cached) { state.data = JSON.parse(cached); render(); toast('오프라인이라 마지막 저장본을 보여줄게'); }
    else { $('#app').innerHTML = `<div class="notice">연결이 안 돼: ${esc(e.message)}<br>⚙️ 설정에서 주소와 토큰을 확인해줘.</div>`; }
  } finally {
    state.loading = false; $('#refreshBtn').classList.remove('spin');
  }
}

function addMonths(key, n) {
  let y = +key.slice(0, 4), m = +key.slice(5, 7) + n;
  while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; }
  return y + '-' + String(m).padStart(2, '0');
}

function render() {
  const d = state.data; if (!d) return;
  const L = d.living, C = d.card, N = d.next, S = d.settings || {}, P = d.plan;
  const incomeName = S.수입이름 || '월수입';
  const usedPct = Math.min(100, Math.max(0, L.net / L.budget * 100));
  const showCard = C.limit > 0 || C.expected > 0;
  const cardPct = C.limit ? Math.min(100, C.expected / C.limit * 100) : 0;
  const over = L.remaining < 0;
  const bank = L.bank ?? L.toss;

  let h = `
  <div class="cycle">
    <button class="icon-btn" data-nav="-1" aria-label="이전 사이클"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="mid"><b>${d.cycle.label}</b><span>${showCard ? d.cycle.payLabel + ' · ' : ''}${d.isCurrent ? `마감까지 ${d.daysLeft}일` : ''}</span></div>
    <button class="icon-btn" data-nav="1" aria-label="다음 사이클" ${d.isCurrent ? 'style="visibility:hidden"' : ''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>`;

  if (NATIVE && d.isCurrent) {
    const lOn = window.Android.listenerEnabled(), bOn = window.Android.batteryOk();
    if (!lOn) h += `<section class="card setup"><div class="label"><span>① 알림 읽기 켜기</span></div>
      <p>카드·은행 알림을 읽어야 저절로 기록돼. 버튼을 누르고 <b>만나장부</b>를 켜줘. 알림 내용은 이 폰 밖으로 나가지 않아.</p>
      <button class="btn" id="btnListener">알림 읽기 켜러 가기</button>
      <p class="hint">켜려고 할 때 <b>"제한된 설정"</b> 창이 뜨거나 스위치가 회색이면:<br>폰 <b>설정 → 애플리케이션 → 만나장부 → 오른쪽 위 ⋮ → 제한된 설정 허용</b>을 누른 뒤 다시 해줘.</p></section>`;
    else if (!bOn) h += `<section class="card setup"><div class="label"><span>② 잠들지 않게 하기</span></div>
      <p>폰이 배터리를 아끼려고 만나장부를 재우면 알림을 놓칠 수 있어. <b>허용</b>을 눌러줘.</p>
      <button class="btn" id="btnBattery">배터리 절전에서 빼기</button></section>`;
  }

  if (d.unparsed && d.unparsed.length && d.isCurrent) {
    h += `<button class="notice fixbar" id="openUnparsed">놓친 알림 <b>${d.unparsed.length}건</b>이 있어. 눌러서 직접 기록하면, 다음부터는 자동으로 알아볼게 →</button>`;
  }

  h += `
  <section class="card">
    <div class="label"><span>생활비</span><span>목표 ${won(L.budget)}원</span></div>
    <div class="big ${over ? 'over' : ''}">${won(Math.abs(L.remaining))}<small>원 ${over ? '초과' : '남음'}</small></div>
    <div class="bar ${over ? 'over' : ''}"><i style="width:${over ? 100 : usedPct}%"></i></div>
    <div class="row"><span>쓴 돈</span><b>${won(L.spent)}원</b></div>
    <div class="row"><span>&nbsp;&nbsp;└ 카드 · 계좌·페이</span><span>${won(L.card)} · ${won(bank)}</span></div>
    <div class="row"><span>들어온 돈</span><b class="plus">+${won(L.income)}원</b></div>
  </section>`;

  if (P && P.income) {
    const o2 = P.myRemaining < 0;
    h += `
  <section class="card">
    <div class="label"><span>내 지갑 · ${esc(incomeName)}</span><span>${d.cycle.label}</span></div>
    <div class="big ${o2 ? 'over' : ''}" style="font-size:26px">${won(Math.abs(P.myRemaining))}<small>원 ${o2 ? '더 씀' : '남음'}</small></div>
    <div class="row"><span>${esc(incomeName)}</span><b class="plus">+${won(P.income)}원</b></div>
    ${P.salaryFixedSum ? `<div class="row"><span>${esc(incomeName)}에서 나가는 고정지출</span><span>-${won(P.salaryFixedSum)}원</span></div>` : ''}
    ${(d.salaryFixed || []).map(f => `<div class="row" style="font-size:12.5px;padding:2px 0"><span>&nbsp;&nbsp;└ ${esc(f.name)}</span><span>${won(f.amount)}</span></div>`).join('')}
    ${P.parentPays || !P.cardFixed ? '' : `<div class="row"><span>카드 고정비·할부</span><span>-${won(P.cardFixed)}원</span></div>`}
    <div class="divider"></div>
    <div class="row"><span>생활에 쓸 수 있는 내 돈</span><b>${won(P.mine)}원</b></div>
    <div class="row"><span>계좌·페이로 쓴 생활비</span><span>-${won(P.tossNet)}원</span></div>
    ${P.parentPays ? '' : `<div class="row"><span>카드로 쓴 생활비</span><span>-${won(Math.max(L.card, 0))}원</span></div>`}
    ${o2 ? `<div class="notice" style="margin:10px 0 0">${esc(incomeName)}보다 <b>${won(-P.myRemaining)}원</b> 더 썼어. 차액은 다른 통장에서 채운 돈이야.</div>`
         : `<div class="notice" style="margin:10px 0 0;background:var(--accent-soft);color:var(--accent)">이대로면 이번 사이클에 <b>${won(P.myRemaining)}원</b>을 모을 수 있어.</div>`}
  </section>`;
  }

  if (L.gapCount > 0) h += `<div class="notice">알림 없이 찾아낸 돈 <b>${L.gapCount}건</b>이 생활비에 잡혀 있어. 아래 내역의 주황색 표시를 눌러 확인해줘. 내 계좌끼리 옮긴 거면 <b>이동</b>, 월급·사례비면 <b>수입</b>으로 바꾸면 돼.</div>`;

  if (showCard) {
    h += `
  <section class="card">
    <div class="label"><span>카드 결제예정 · ${d.cycle.payLabel}${P && P.parentPays ? ' · ' + esc(P.payer) + ' 부담' : ''}</span><span>한도 ${won(C.limit)}원</span></div>
    <div class="big">${won(C.expected)}<small>원</small></div>
    <div class="bar ${C.limit && C.expected > C.limit ? 'over' : ''}"><i style="width:${cardPct}%"></i></div>
    <div class="row"><span>승인된 금액</span><b>${won(C.confirmed)}원</b></div>
    ${C.pending.map(p => `<div class="row"><span>&nbsp;&nbsp;└ 아직 안 나간 ${esc(p.name)}${p.fx ? ` ($${p.fx})` : ''}</span><span>${won(p.amount)}원</span></div>`).join('')}
    ${C.hasBaseline ? `<div class="row"><span>&nbsp;&nbsp;└ 시작 기준값 포함</span><span class="pill">카드앱 확인값</span></div>` : ''}
    ${d.kbCumulative && d.isCurrent ? `<div class="divider"></div><div class="row"><span>카드사 누적(할부 원금 포함)</span><span>${won(d.kbCumulative.cumulative)}원</span></div>` : ''}
  </section>

  <section class="card">
    <div class="label"><span>다음 결제 미리보기 · ${N.cycle.payLabel}</span></div>
    <div class="big" style="font-size:24px">${won(N.card.expected)}<small>원 예상</small></div>
    <div class="row"><span>할부·승인분</span><span>${won(N.card.confirmed)}원</span></div>
    <div class="row"><span>고정비 예정</span><span>${won(N.card.pendingSum)}원</span></div>
    ${C.limit ? `<div class="row"><span>남는 카드 여유</span><b>${won(N.card.limit - N.card.expected)}원</b></div>` : ''}
    ${N.plan && N.plan.income ? `<div class="row"><span>생활에 쓸 수 있는 내 돈</span><b class="plus">${won(N.plan.mine)}원</b></div>` : ''}
  </section>`;
  }

  if (d.installments.length) {
    h += `<div class="section-title">남은 할부</div><section class="card">` +
      d.installments.map(i => `<div class="row"><span>${esc(i.desc)}</span><span>${won(i.monthly)}원 · ${i.left}회 · ${esc(i.lastCycle)}까지</span></div>`).join('') +
      `</section>`;
  }

  const tabs = ['전체', '생활', '고정·할부', '이동·수입·제외'];
  h += `<div class="tabs">${tabs.map(t => `<button class="tab ${state.filter === t ? 'on' : ''}" data-filter="${t}">${t}</button>`).join('')}</div>`;

  const list = d.transactions.filter(t => t.cycle === d.focusKey).filter(t => {
    if (state.filter === '전체') return true;
    if (state.filter === '생활') return t.cls === '생활';
    if (state.filter === '고정·할부') return t.cls === '고정' || t.cls === '할부';
    return t.cls === '이동' || t.cls === '수입' || t.cls === '제외';
  });
  if (!list.length) h += `<div class="empty">아직 내역이 없어.<br>결제 알림이 오면 자동으로 쌓여!${NATIVE ? '<br><small>(알림이 온 뒤 앱을 열면 정리돼)</small>' : ''}</div>`;
  let lastDay = '';
  for (const t of list) {
    const day = t.time.slice(0, 10);
    if (day !== lastDay) {
      const dt = new Date(day + 'T00:00:00');
      h += `<div class="day">${dt.getMonth() + 1}월 ${dt.getDate()}일 (${'일월화수목금토'[dt.getDay()]})</div>`;
      lastDay = day;
    }
    const inflow = t.dir > 0;
    const dim = t.cls === '이동' || t.cls === '제외' || t.cls === '수입';
    const [badge, color] = srcBadge(t.source);
    const sub = [t.time.slice(11), t.type, t.months > 1 ? t.months + '개월' : '', t.currency === 'USD' && t.fx ? '$' + t.fx : '']
      .filter(Boolean).join(' · ');
    h += `<div class="tx ${dim ? 'dim' : ''}" data-id="${esc(t.id)}">
      <div class="src c-${color}">${esc(badge)}</div>
      <div class="mid"><div class="t">${esc(t.desc)}</div>
        <div class="s">${esc(sub)}<span class="chip ${(t.type === '잔액차이' || t.type === '카드누락추정') && t.cls === '생활' ? 'gap' : esc(t.cls)}">${esc(t.cls)}</span></div></div>
      <div class="amt ${inflow ? 'plus' : ''}">${inflow ? '+' : '-'}${won(t.amount)}${t.balance != null && !t.card ? `<small>잔액 ${won(t.balance)}</small>` : ''}</div>
    </div>`;
  }
  const bals = d.balances || (d.tossBalance ? [d.tossBalance] : []);
  if (bals.length && d.isCurrent) {
    h += `<div class="section-title">계좌 잔액</div><section class="card">` +
      bals.map(b => `<div class="row"><span>${esc(b.source === 'TOSS' ? '토스뱅크' : b.source)}</span><span>${won(b.balance)}원 <small style="color:var(--sub)">${esc(b.time.slice(5))}</small></span></div>`).join('') +
      `</section>`;
  }
  h += `<div class="muted">환율 1$ = ${d.fx.usdkrw ? won(d.fx.usdkrw) : '?'}원 · 업데이트 ${esc(d.now)}${NATIVE ? ' · 이 폰에만 저장됨' : ''}</div>`;

  $('#app').innerHTML = h;
  const ub = $('#openUnparsed'); if (ub) ub.onclick = () => openUnparsed(0);
  const bl = $('#btnListener'); if (bl) bl.onclick = () => window.Android.openListenerSettings();
  const bb = $('#btnBattery'); if (bb) bb.onclick = () => window.Android.openBatterySettings();
}

function openSheet(html) {
  $('#sheet').onclick = null;
  $('#sheet').innerHTML = html; $('#sheet').classList.add('open'); $('#sheetBg').classList.add('open');
  $('#sheet').scrollTop = 0;
}

// ── 거래 하나: 분류 바꾸기 + 금액·이름 고치기
function openTx(id) {
  const t = state.data.transactions.find(x => x.id === id); if (!t) return;
  const note = t.type === '잔액차이'
    ? '잔액이 알림 없이 바뀐 만큼이야. 내 계좌끼리 옮긴 돈이면 <b>이동</b>, 월급·사례비면 <b>수입</b>, 실제로 쓴/받은 돈이면 <b>생활</b>으로 둬.'
    : t.type === '카드누락추정'
    ? '카드 문자의 누적 금액이 맞지 않아서 찾아낸 결제야. 카드앱에서 확인해보고, 이미 기록된 거면 <b>제외</b>로 바꿔줘.'
    : `${esc(t.time)} · ${esc(t.source === 'TOSS' ? '토스뱅크' : t.source)} · ${esc(t.type)}`;
  openSheet(`<h3>${esc(t.desc)} <span style="font-weight:600">${t.dir > 0 ? '+' : '-'}${won(t.amount)}원</span></h3>
    <p>${note}</p>
    <div class="grid">${Object.keys(CLASS_INFO).map(c =>
      `<button class="opt ${t.cls === c ? 'on' : ''}" data-cls="${c}" data-id="${esc(t.id)}">${c}<small>${CLASS_INFO[c]}</small></button>`).join('')}</div>
    <details class="edit"><summary>금액·이름이 틀렸으면 고치기</summary>
      <label class="of">이름</label><input id="eDesc" value="${esc(t.desc)}">
      <label class="of">금액(원)</label><input id="eAmt" inputmode="numeric" value="${t.amount}">
      <button class="btn" id="eSave">고친 내용 저장</button>
    </details>`);
  $('#eSave').onclick = async () => {
    try { await api({ action: 'edit', id: t.id, amount: $('#eAmt').value, desc: $('#eDesc').value }); closeSheet(); toast('고쳤어'); load(state.cycle); }
    catch (e) { toast(e.message); }
  };
}

async function reclass(id, cls) {
  closeSheet();
  const t = state.data.transactions.find(x => x.id === id); if (t) t.cls = cls; render();
  try { await api({ action: 'reclass', id, cls }); toast(`'${cls}'(으)로 바꿨어`); }
  catch (e) { toast('저장 실패: ' + e.message); }
  load(state.cycle);
}

// ── 놓친 알림 직접 처리 + 다음부터 자동 인식
function guessWord(u) {
  const t = (u.title || '').trim();
  if (t && !/^\d+$/.test(t) && t.length <= 12) return t;
  const m = (u.text || '').replace(/\[Web발신\]/g, '').match(/[가-힣A-Za-z]{2,8}(?:카드|체크|은행|뱅크|페이)?/);
  return m ? m[0] : '';
}
function openUnparsed(i) {
  const list = state.data.unparsed || []; const u = list[i]; if (!u) { closeSheet(); return; }
  const word = guessWord(u);
  openSheet(`<h3>놓친 알림 ${i + 1}/${list.length}</h3>
    <p style="margin-bottom:8px">${esc(u.time)} · ${esc(u.app)}</p>
    <div class="rawbox">${esc((u.title ? u.title + '\n' : '') + u.text)}</div>
    <label class="of">이 알림은?</label>
    <div class="seg" id="fKind">
      <button data-k="card">신용카드 결제</button><button data-k="check">체크카드·페이 결제</button>
      <button data-k="out">계좌 출금·송금</button><button data-k="in">입금</button>
    </div>
    <label class="of">금액(원) — 알림 속 숫자를 눌러도 돼</label>
    <div class="amts">${u.amounts.map(a => `<button data-a="${a}">${won(a)}</button>`).join('')}</div>
    <input id="fAmt" inputmode="numeric" placeholder="예: 12000">
    <label class="of">어디서 / 누구에게</label><input id="fDesc" placeholder="예: 스타벅스">
    <label class="learn"><input type="checkbox" id="fLearn" checked> 다음부터 이런 알림은 자동으로 기록하기</label>
    <div id="learnBox">
      <label class="of">카드·은행 이름</label><input id="fName" value="${esc(word)}" placeholder="예: 신한체크">
      <label class="of">알림 속에 늘 들어 있는 단어</label><input id="fWord" value="${esc(word)}" placeholder="예: 신한체크">
    </div>
    <button class="btn" id="fSave">기록하기</button>
    <button class="btn ghost" id="fIgnore">돈 알림이 아니야 (무시)</button>`);
  let kind = '';
  $('#fKind').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; kind = b.dataset.k;
    [...$('#fKind').children].forEach(x => x.classList.toggle('on', x === b)); };
  $('.amts').onclick = (e) => { const b = e.target.closest('button'); if (b) $('#fAmt').value = b.dataset.a; };
  $('#fLearn').onchange = () => { $('#learnBox').style.display = $('#fLearn').checked ? '' : 'none'; };
  const next = () => { state.data.unparsed.splice(i, 1); render(); if (state.data.unparsed.length) openUnparsed(Math.min(i, state.data.unparsed.length - 1)); else closeSheet(); };
  $('#fIgnore').onclick = async () => { try { await api({ action: 'fix', rawId: u.id, kind: 'ignore' }); next(); } catch (e) { toast(e.message); } };
  $('#fSave').onclick = async () => {
    if (!kind) { toast('어떤 알림인지 골라줘'); return; }
    if (!$('#fAmt').value) { toast('금액을 넣어줘'); return; }
    try {
      await api({ action: 'fix', rawId: u.id, kind, amount: $('#fAmt').value, desc: $('#fDesc').value,
        name: $('#fName').value || u.app, learn: $('#fLearn').checked, word: $('#fWord').value });
      toast($('#fLearn').checked ? '기록했어. 다음부터는 자동으로 알아볼게' : '기록했어');
      next(); load(state.cycle);
    } catch (e) { toast(e.message); }
  };
}

    <label class="of">매달 들어오는 돈의 이름</label><input id="wIncName" value="${esc(S.수입이름 || '월수입')}" placeholder="예: 월급, 사례비, 용돈">

    <label class="of">한 달 생활비 목표(원) — 식비·카페·교통처럼 그때그때 쓰는 돈</label><input id="wBudget" inputmode="numeric" value="${S.생활비예산 || 400000}">
    <label class="learn"><input type="checkbox" id="wCard" ${usesCard ? 'checked' : ''}> 신용카드를 써</label>
    <div id="cardBox" style="${usesCard ? '' : 'display:none'}">
      <label class="of">카드를 한 달에 이만큼까지만 쓸래(원)</label><input id="wLimit" inputmode="numeric" value="${S.카드한도 || 500000}">
      <label class="of">카드 이용기간 시작일 — 카드앱의 "이용기간"을 봐줘 (예: 전월 19일~당월 18일이면 19, 1일~말일이면 1)</label><input id="wStart" inputmode="numeric" value="${S.사이클시작일 || 1}">
      <label class="of">카드 결제일(매달 며칠)</label><input id="wPay" inputmode="numeric" value="${S.결제일 || 14}">
      <label class="of">카드값은 누가 내?</label>
      <div class="seg" id="wPayer"><button data-v="본인">내가 내</button><button data-v="가족">가족이 내줘</button></div>
    </div>
    <button class="btn" id="wSave">저장하고 시작하기</button>`);
  let payer = S.카드대금부담 && S.카드대금부담 !== '본인' ? S.카드대금부담 : '본인';
  const mark = () => [...$('#wPayer').children].forEach(x => x.classList.toggle('on', (x.dataset.v === '본인') === (payer === '본인')));
  mark();
  $('#wPayer').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; payer = b.dataset.v === '본인' ? '본인' : (payer !== '본인' ? payer : '가족'); mark(); };
  $('#wCard').onchange = () => { $('#cardBox').style.display = $('#wCard').checked ? '' : 'none'; };
  $('#wSave').onclick = async () => {
    const card = $('#wCard').checked;
    const settings = { 이름: $('#wName').value.trim(), 수입이름: $('#wIncName').value.trim() || '월수입', 월수입: $('#wInc').value || 0,
      생활비예산: $('#wBudget').value || 0, 카드한도: card ? ($('#wLimit').value || 0) : 0,
      사이클시작일: $('#wStart').value || 1, 결제일: $('#wPay').value || 14, 카드대금부담: payer };
    try { await api({ action: 'config', settings }); closeSheet(); toast('저장했어!'); state.data = null; load(); }
    catch (e) { toast(e.message); }
  };
}

      <button data-go="battery">배터리 절전 예외<small>${window.Android.batteryOk() ? '설정됨 ✅' : '설정 안 됨 — 눌러서 허용'}</small></button>
      <button data-go="export">백업 파일 저장<small>폰을 바꾸거나 잃어버릴 때를 대비해 가끔 저장해줘</small></button>
      <button data-go="import">백업 불러오기<small>저장해 둔 백업 파일로 되돌리기</small></button>
    </div>
    <p class="muted">만나장부 ${esc(v)} · 모든 기록은 이 폰 안에만 저장돼</p>`);
  $('.menu').onclick = (e) => {
    const b = e.target.closest('[data-go]'); if (!b) return;
    const g = b.dataset.go;
    if (g === 'wizard') openWizard(false);
    else if (g === 'fixed') openFixedList();
    else if (g === 'rules') openRules();
    else if (g === 'listener') window.Android.openListenerSettings();
    else if (g === 'battery') window.Android.openBatterySettings();
    else if (g === 'export') { const d = new Date(); window.Android.exportBackup(Local.exportJson(), `manna-backup-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`); }
    else if (g === 'import') window.Android.importBackup();
  };
}

const KINDS = ['신용카드', '체크카드', '은행·페이', '은행 문자'];
const plainWord = (w) => String(w || '').replace(/\\d\{4\}/g, '0000').replace(/\\/g, '').split('|').join(' 또는 ');
function openRules() {
  const rules = state.data.rules || [];
  openSheet(`<h3>카드·은행 목록</h3>
    <p>위에 있는 줄이 먼저 적용돼. 안 쓰는 건 꺼도 되고, 켜둬도 문제없어.</p>
    <button class="btn" data-ri="-1" style="margin-bottom:10px">+ 새로 추가</button>
    <div class="rlist">${rules.map((r, i) => `<div class="ritem ${r.active ? '' : 'off'}" data-ri="${i}">
      <div><b>${esc(r.name)}</b><small>${esc(r.kind)} · ${esc(r.app || '아무 앱')}${r.word ? ' · "' + esc(plainWord(r.word)) + '"' : ''}</small></div>
      <span class="pill">${r.active ? '켜짐' : '꺼짐'}</span></div>`).join('')}</div>`);
  $('#sheet').onclick = (e) => { const it = e.target.closest('[data-ri]'); if (it) editRule(+it.dataset.ri); };
}
function editRule(i) {
  const r = i >= 0 ? state.data.rules[i] : { name: '', kind: '신용카드', app: '메시지', word: '', active: true };
  $('#sheet').onclick = null;
  openSheet(`<h3>${i >= 0 ? '고치기' : '새로 추가'}</h3>
    <label class="of">이름 (앱에 보일 이름)</label><input id="rName" value="${esc(r.name)}" placeholder="예: 신한체크">
    <label class="of">종류</label><div class="seg" id="rKind">${KINDS.map((k) => `<button data-k="${k}" class="${r.kind === k ? 'on' : ''}">${k}</button>`).join('')}</div>
    <label class="of">알림을 보내는 앱 이름 (문자는 "메시지", 비우면 아무 앱)</label><input id="rApp" value="${esc(r.app)}">
    <label class="of">알림 속에 늘 들어 있는 단어 (여러 개는 | 로 구분)</label><input id="rWord" value="${esc(r.word)}" placeholder="예: 신한체크">
    <label class="learn"><input type="checkbox" id="rOn" ${r.active ? 'checked' : ''}> 사용하기</label>
    <button class="btn" id="rSave">저장</button>
    ${i >= 0 ? '<button class="btn ghost" id="rDel">이 줄 지우기</button>' : ''}`);
  let kind = r.kind;
  $('#rKind').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; kind = b.dataset.k; [...$('#rKind').children].forEach((x) => x.classList.toggle('on', x === b)); };
  $('#rSave').onclick = async () => { try { await api({ action: 'saveRule', index: i, rule: { name: $('#rName').value, kind, app: $('#rApp').value, word: $('#rWord').value, active: $('#rOn').checked } }); toast('저장했어'); state.data = Local.summary(state.cycle); openRules(); } catch (e) { toast(e.message); } };
  const del = $('#rDel'); if (del) del.onclick = async () => { await api({ action: 'deleteRule', index: i }); state.data = Local.summary(state.cycle); openRules(); };
}

function openFixedList() {
  const list = state.data.fixedList || [];
  const inc = (state.data.settings || {}).수입이름 || '월수입';
  openSheet(`<h3>고정지출 목록</h3>
    <p>매달 나가는 돈을 적어두면, 아직 안 나갔어도 미리 계산에 넣어줘.</p>
    <button class="btn" data-fi="-1" style="margin-bottom:10px">+ 새로 추가</button>
    <div class="rlist">${list.length ? list.map((f, i) => `<div class="ritem ${f.active ? '' : 'off'}" data-fi="${i}">
      <div><b>${esc(f.name)}</b><small>${f.source === '수입' ? esc(inc) + '에서 나감' : '카드로 나감'}${f.keyword ? ' · "' + esc(f.keyword) + '"' : ''}</small></div>
      <span>${won(f.amount)}원</span></div>`).join('') : '<div class="empty">아직 없어</div>'}</div>`);
  $('#sheet').onclick = (e) => { const it = e.target.closest('[data-fi]'); if (it) editFixed(+it.dataset.fi); };
}
function editFixed(i) {
  const f = i >= 0 ? state.data.fixedList[i] : { name: '', keyword: '', amount: '', source: '카드', active: true };
  const inc = (state.data.settings || {}).수입이름 || '월수입';
  $('#sheet').onclick = null;
  openSheet(`<h3>${i >= 0 ? '고치기' : '고정지출 추가'}</h3>
    <label class="of">이름</label><input id="xName" value="${esc(f.name)}" placeholder="예: 통신비, 넷플릭스, 십일조">
    <label class="of">한 달 금액(원)</label><input id="xAmt" inputmode="numeric" value="${f.amount}">
    <label class="of">어디서 나가?</label><div class="seg" id="xSrc">
      <button data-s="카드" class="${f.source !== '수입' ? 'on' : ''}">카드로 결제</button><button data-s="수입" class="${f.source === '수입' ? 'on' : ''}">${esc(inc)}에서 바로</button></div>
    <label class="of">알림 속 가맹점·받는 사람 이름 (선택 — 이걸 적으면 그 결제를 자동으로 '고정'으로 분류해)</label><input id="xKw" value="${esc(f.keyword)}" placeholder="예: KT, 넷플릭스, 오목사님">
    <label class="learn"><input type="checkbox" id="xOn" ${f.active ? 'checked' : ''}> 사용하기</label>
    <button class="btn" id="xSave">저장</button>
    ${i >= 0 ? '<button class="btn ghost" id="xDel">지우기</button>' : ''}`);
  let src = f.source === '수입' ? '수입' : '카드';
  $('#xSrc').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; src = b.dataset.s; [...$('#xSrc').children].forEach((x) => x.classList.toggle('on', x === b)); };
  $('#xSave').onclick = async () => { try { await api({ action: 'saveFixed', index: i, fixed: { name: $('#xName').value, amount: $('#xAmt').value, source: src, keyword: escapeRe($('#xKw').value.trim()), active: $('#xOn').checked } }); toast('저장했어'); state.data = Local.summary(state.cycle); render(); openFixedList(); } catch (e) { toast(e.message); } };
  const del = $('#xDel'); if (del) del.onclick = async () => { await api({ action: 'deleteFixed', index: i }); state.data = Local.summary(state.cycle); render(); openFixedList(); };
}

window.onNativeNew = () => { if (!$('#sheet').classList.contains('open')) load(state.cycle); };
window.onNativeResume = () => load(state.cycle);
window.onNativeToast = (m) => toast(m);
window.onNativeBack = () => { if ($('#sheet').classList.contains('open')) { closeSheet(); return true; } return false; };
window.onBackupLoaded = (text) => {
  try { Local.restore(text); toast('백업을 불러왔어'); closeSheet(); state.data = null; load(); }
  catch (e) { toast(e.message); }
};

document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-nav]');
  if (nav && state.data) { load(addMonths(state.data.focusKey, +nav.dataset.nav)); return; }
  const f = e.target.closest('[data-filter]');
  if (f) { state.filter = f.dataset.filter; render(); return; }
  const o = e.target.closest('[data-cls]');
  if (o) { reclass(o.dataset.id, o.dataset.cls); return; }
  const tx = e.target.closest('.tx');
  if (tx) { openTx(tx.dataset.id); return; }
});
$('#sheetBg').onclick = closeSheet;
$('#settingsBtn').onclick = openSettings;
$('#refreshBtn').onclick = () => load(state.cycle);
document.addEventListener('visibilitychange', () => { if (!NATIVE && !document.hidden && !state.loading) load(state.cycle); });

if (!NATIVE && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
load();
</script>
</body>
</html>
