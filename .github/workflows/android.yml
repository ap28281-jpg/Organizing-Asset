name: 만나장부 안드로이드 앱 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: 앱 화면 파일 넣기
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html core.js local.js icon-192.png icon-512.png android/app/src/main/assets/www/

      - name: 서명 키 준비 (저장소 비밀값이 있을 때만)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > android/release.keystore; echo "정식 서명 키 사용"; else echo "시험용 키 사용"; fi

      - name: 앱 만들기
        working-directory: android
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle assembleRelease --no-daemon

      - name: 다운로드 링크 갱신 (manna.apk)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk manna.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest manna.apk --title "만나장부 최신판 (빌드 ${{ github.run_number }})" --notes "휴대폰에서 manna.apk를 눌러 설치하세요." --latest
